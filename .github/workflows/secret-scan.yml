name: Tracked Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            case "$name" in
              .env.example|.env.sample|.env.template)
                continue
                ;;
              .env|.env.*)
                printf 'Tracked environment file is not allowed: %q\n' "$file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Scan tracked text for credential patterns
        shell: bash
        run: |
          set -euo pipefail

          patterns=(
            '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----'
            'gh[pousr]_[A-Za-z0-9]{20,}'
            'github_pat_[A-Za-z0-9_]{20,}'
            '(AKIA|ASIA)[0-9A-Z]{16}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            '(SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|DATABASE_URL|POSTGRES_PASSWORD|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN)[[:space:]]*[:=][[:space:]]*[^[:space:]]{16,}'
          )

          placeholder_assignment='[[:space:]]*[:=][[:space:]]*["'"']?(\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|<[^>]+>)["'"']?[[:space:]]*$'

          failed=0
          while IFS= read -r -d '' file; do
            if ! grep -Iq . "$file"; then
              continue
            fi

            for pattern in "${patterns[@]}"; do
              match_lines="$(grep -nEI -- "$pattern" "$file" 2>/dev/null | grep -Ev -- "$placeholder_assignment" | cut -d: -f1 | sort -nu | paste -sd, - || true)"
              if [[ -n "$match_lines" ]]; then
                printf 'Potential committed credential in %q at line(s): %s\n' "$file" "$match_lines"
                failed=1
              fi
            done
          done < <(git ls-files -z)

          if [[ "$failed" -ne 0 ]]; then
            echo "Remove the credential from the tracked file and rotate it if it was real."
            exit 1
          fi

          echo "No blocked credential patterns found in tracked text files."
