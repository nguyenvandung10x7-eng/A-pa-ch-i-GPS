name: Tracked Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            case "$name" in
              .env.example|.env.sample|.env.template)
                continue
                ;;
              .env|.env.*)
                printf 'Tracked environment file is not allowed: %q\n' "$file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Scan tracked text for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          standalone_patterns = [
              re.compile(r'-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{20,}'),
              re.compile(r'(?:AKIA|ASIA)[0-9A-Z]{16}'),
              re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}'),
          ]

          key_names = (
              'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|DATABASE_URL|POSTGRES_PASSWORD|'
              'AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN'
          )
          assignment = re.compile(
              rf'(?P<key_quote>["\']?)(?:{key_names})(?P=key_quote)'
              r'\s*[:=]\s*(?P<value>"[^"\r\n]+"|\'[^\'\r\n]+\'|[^\s#;,}}]+)',
              re.IGNORECASE,
          )
          yaml_block = re.compile(
              rf'^(?P<indent>[ \t]*)(?P<key_quote>["\']?)(?:{key_names})(?P=key_quote)'
              r'\s*:\s*[|>][+-]?\s*(?:#.*)?$',
              re.IGNORECASE,
          )
          placeholder = re.compile(
              r'^(?:'
              r'\$[A-Za-z_][A-Za-z0-9_]*|'
              r'\$\{[A-Za-z_][A-Za-z0-9_]*(?::?[-+?=][^}]*)?\}|'
              r'(?:process|import\.meta)\.env\.[A-Za-z_][A-Za-z0-9_]*|'
              r'<[^>]+>'
              r')$'
          )

          raw_paths = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [os.fsdecode(path) for path in raw_paths.split(b'\0') if path]
          findings = []

          for path in paths:
              try:
                  data = open(path, 'rb').read()
              except OSError:
                  continue
              if b'\0' in data:
                  continue
              lines = data.decode('utf-8', errors='ignore').splitlines()

              for index, line in enumerate(lines):
                  line_number = index + 1
                  hit = any(pattern.search(line) for pattern in standalone_patterns)

                  if not hit:
                      for match in assignment.finditer(line):
                          value = match.group('value').strip()
                          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                              value = value[1:-1]
                          if placeholder.fullmatch(value):
                              continue
                          if len(value) >= 16:
                              hit = True
                              break

                  if not hit:
                      block = yaml_block.match(line)
                      if block:
                          base_indent = len(block.group('indent').expandtabs(8))
                          block_lines = []
                          for following in lines[index + 1:]:
                              if not following.strip():
                                  if block_lines:
                                      block_lines.append('')
                                  continue
                              following_indent = len(following) - len(following.lstrip(' \t'))
                              if following_indent <= base_indent:
                                  break
                              block_lines.append(following.strip())

                          block_value = '\n'.join(block_lines).strip()
                          if (
                              len(block_value) >= 16
                              and not placeholder.fullmatch(block_value)
                          ):
                              hit = True

                  if hit:
                      findings.append((path, line_number))

          if findings:
              for path, line_number in findings:
                  print(f'Potential committed credential in {path!r} at line: {line_number}')
              print('Remove the credential from the tracked file and rotate it if it was real.')
              sys.exit(1)

          print('No blocked credential patterns found in tracked text files.')
          PY
