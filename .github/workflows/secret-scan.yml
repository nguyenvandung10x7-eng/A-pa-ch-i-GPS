name: Tracked Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Tracked environment files are not allowed:"
            printf '%s\n' "$tracked_env_files"
            exit 1
          fi

      - name: Scan tracked text for credential patterns
        shell: bash
        run: |
          set -euo pipefail

          patterns=(
            '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----'
            'gh[pousr]_[A-Za-z0-9]{20,}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'AKIA[0-9A-Z]{16}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            '(SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|DATABASE_URL|POSTGRES_PASSWORD)[[:space:]]*[:=][[:space:]]*["'"']?[A-Za-z0-9._:/+@=-]{20,}'
          )

          failed=0
          while IFS= read -r -d '' file; do
            if ! grep -Iq . "$file"; then
              continue
            fi

            for pattern in "${patterns[@]}"; do
              if grep -nEI -- "$pattern" "$file" >/tmp/secret-scan-match 2>/dev/null; then
                echo "Potential committed credential in $file:"
                cat /tmp/secret-scan-match
                failed=1
              fi
            done
          done < <(git ls-files -z)

          rm -f /tmp/secret-scan-match
          if [[ "$failed" -ne 0 ]]; then
            echo "Remove the credential from the tracked file and rotate it if it was real."
            exit 1
          fi

          echo "No blocked credential patterns found in tracked text files."
