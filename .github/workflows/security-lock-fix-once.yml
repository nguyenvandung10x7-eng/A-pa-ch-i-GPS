name: Security Lock Fix Once

on:
  push:
    branches:
      - agent/production-security-audit

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-security-audit
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile and apply compatible audit fixes
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
      - name: Require production audit to pass
        run: npm audit --omit=dev --audit-level=high
      - name: Remove one-shot workflow and push lockfile repair
        run: |
          git rm .github/workflows/security-lock-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair vulnerable production dependency lockfile"
          git push origin HEAD:agent/production-security-audit
