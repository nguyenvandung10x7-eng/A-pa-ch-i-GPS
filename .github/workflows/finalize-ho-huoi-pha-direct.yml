name: Finalize Ho Huoi Pha metadata direct

on:
  push:
    branches:
      - agent/clear-ho-huoi-pha-representative-artwork
    paths:
      - .github/workflows/finalize-ho-huoi-pha-direct.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clear-ho-huoi-pha-representative-artwork
          fetch-depth: 0
      - name: Apply exact reviewed metadata patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ledger = Path('docs/asset-provenance.md')
          s = ledger.read_text()
          explicit = "| `public/images/tasks/ho-huoi-pha-mthen.webp` | CLEARED | `public/images/tasks/provenance/ho-huoi-pha-mthen.json`; exact derivative SHA-256 `77ca90a38d4b1632a777e1d605eab6f6a81c05dd309358ead55e357d6c579989` regenerated from the Commons API-resolved canonical original SHA-256 `a229af8197b17851420e8ff3b02119083e0619b28ae711f2b2a1c84a2d109f6f`. The source is representative Dien Bien Phu river scenery, not an exact verified photograph of Hồ Huổi Phạ. | Adam Jones from Kelowna, BC, Canada; CC BY-SA 2.0; link the licence and indicate that the image was resized/re-encoded. Attribution/share-alike requirements apply. Rights clearance does not assert exact-location identity. |\n"
          anchor = "| `public/images/tasks/cong-vien-noong-bua-mthen.webp` | CLEARED |"
          assert s.count(anchor) == 1, s.count(anchor)
          assert 'public/images/tasks/ho-huoi-pha-mthen.webp` | CLEARED' not in s
          start = s.index(anchor)
          end = s.index('\n', start) + 1
          s = s[:end] + explicit + s[end:]
          old = "| `ho-huoi-pha-mthen` | Present | UNVERIFIED | Reconcile the shipped binary to the exact original, then verify licence/version and attribution. |"
          new = "| `ho-huoi-pha-mthen` | Present; representative source resolved via MediaWiki API, regenerated and hashed in dedicated provenance record | CLEARED | Keep `public/images/tasks/provenance/ho-huoi-pha-mthen.json` with the shipped binary; preserve Adam Jones / CC BY-SA 2.0 attribution, licence link, modification notice and share-alike terms. Public credit must disclose that the source is representative rather than an exact verified photograph of Hồ Huổi Phạ. |"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          ledger.write_text(s)

          credits = Path('src/data/assetCredits.ts')
          c = credits.read_text()
          marker = "  {\n    id: 'cho-noong-bua-trai-ban',"
          assert c.count(marker) == 1, c.count(marker)
          assert "id: 'ho-huoi-pha-mthen'" not in c
          block = """  {
    id: 'ho-huoi-pha-mthen',
    usage: { vi: 'Ảnh sông Điện Biên Phủ đại diện dùng cho Hồ Huổi Phạ', en: 'Representative Dien Bien Phu river scenery used for Ho Huoi Pha' },
    author: 'Adam Jones from Kelowna, BC, Canada',
    sourceUrl: 'https://commons.wikimedia.org/wiki/File:Ron_River_View_-_Dien_Bien_Phu_-_Vietnam_(48159135931).jpg',
    ...cc('2.0'),
    status: 'cleared',
    note: {
      vi: 'Exact binary đang ship được tái tạo từ canonical Commons original do MediaWiki API trả về, có hash nguồn/derivative và recipe trong release ledger. Nguồn là ảnh sông ở Điện Biên Phủ mang tính đại diện, không phải ảnh đã xác minh chính xác Hồ Huổi Phạ. CLEARED chỉ xác nhận quyền/provenance của binary. Ảnh đã được resize và re-encode sang WebP; CC BY-SA 2.0 và yêu cầu attribution/share-alike vẫn áp dụng.',
      en: 'The exact shipped binary was regenerated from the canonical Commons original returned by the MediaWiki API, with source/derivative hashes and the transform recipe recorded in the release ledger. The source is representative Dien Bien Phu river scenery, not an exact verified photograph of Ho Huoi Pha. CLEARED covers rights/provenance for the binary only. The image was resized and re-encoded to WebP; CC BY-SA 2.0 attribution/share-alike terms still apply.',
    },
  },
"""
          credits.write_text(c.replace(marker, block + marker))
          PY
          rm .github/workflows/finalize-ho-huoi-pha-direct.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/asset-provenance.md src/data/assetCredits.ts .github/workflows/finalize-ho-huoi-pha-direct.yml
          git commit -m 'Finalize Ho Huoi Pha asset credits'
          git push origin HEAD:agent/clear-ho-huoi-pha-representative-artwork
