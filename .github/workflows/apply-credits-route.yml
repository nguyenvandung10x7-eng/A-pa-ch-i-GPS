name: Apply Credits route

on:
  push:
    branches:
      - agent/public-asset-credits

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-asset-credits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch public route and account sheet
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const patchOnce = (text, needle, replacement, file) => {
            if (text.includes(replacement)) return text;
            if (!text.includes(needle)) throw new Error(`Needle not found in ${file}: ${needle}`);
            return text.replace(needle, replacement);
          };

          const appPath = 'src/App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = patchOnce(
            app,
            "import { ChallengePage } from './pages/ChallengePage';",
            "import { ChallengePage } from './pages/ChallengePage';\nimport { CreditsPage } from './pages/CreditsPage';",
            appPath,
          );
          app = patchOnce(
            app,
            '      <Route path="/nearby" element={<BookUtilityPage language={language} mode="near-me" />} />',
            '      <Route path="/nearby" element={<BookUtilityPage language={language} mode="near-me" />} />\n      <Route path="/credits" element={<CreditsPage language={language} />} />',
            appPath,
          );
          fs.writeFileSync(appPath, app);

          const shellPath = 'src/components/MobileAppShell.tsx';
          let shell = fs.readFileSync(shellPath, 'utf8');
          shell = patchOnce(shell, "    legal: 'Pháp lý',", "    legal: 'Pháp lý',\n    credits: 'Nguồn ảnh',", shellPath);
          shell = patchOnce(shell, "    legal: 'Legal',", "    legal: 'Legal',\n    credits: 'Credits',", shellPath);
          shell = patchOnce(
            shell,
            "  || pathname === '/nearby'\n);",
            "  || pathname === '/nearby'\n  || pathname === '/credits'\n);",
            shellPath,
          );
          shell = patchOnce(
            shell,
            '              <Link to="/legal" onClick={() => setAccountOpen(false)}><span className="editorial-account-sheet__text-icon">i</span><span>{copy.legal}</span><ChevronRight /></Link>',
            '              <Link to="/legal" onClick={() => setAccountOpen(false)}><span className="editorial-account-sheet__text-icon">i</span><span>{copy.legal}</span><ChevronRight /></Link>\n              <Link to="/credits" onClick={() => setAccountOpen(false)}><span className="editorial-account-sheet__text-icon">©</span><span>{copy.credits}</span><ChevronRight /></Link>',
            shellPath,
          );
          fs.writeFileSync(shellPath, shell);
          NODE
      - name: Remove one-shot workflow and push
        run: |
          rm .github/workflows/apply-credits-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MobileAppShell.tsx .github/workflows/apply-credits-route.yml
          git commit -m "Wire public asset credits into the app"
          git push origin HEAD:agent/public-asset-credits
