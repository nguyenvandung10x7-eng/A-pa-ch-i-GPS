name: Finalize A Pa Chai representative artwork clearance

on:
  push:
    branches: [agent/clear-cot-co-a-pa-chai-artwork]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/clear-cot-co-a-pa-chai-artwork
          fetch-depth: 0
      - name: Update ledger and Credits exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          ledger=Path('docs/asset-provenance.md')
          text=ledger.read_text()
          anchor='| `public/images/tasks/thac-ke-nenh-mthen.webp` | CLEARED | `public/images/tasks/provenance/thac-ke-nenh-mthen.json`; exact derivative SHA-256 `ed3bae64bd8875b84d9aaabd1f744f72b87d0e9dfaf3ac4d29ab2fd2a468b7e8` regenerated from the Commons API-resolved canonical original SHA-256 `4f75305fd3c43da3b5522b728b8420f141a27472331d155562a32975476dee6b`. `SOURCES.md` contains a mismatched portal page URL; provenance is resolved directly to the Commons original and the source is representative rather than an exact verified photograph of Thác Kê Nênh. | Adam Jones from Kelowna, BC, Canada; CC BY-SA 2.0; link the licence and indicate that the image was resized/re-encoded. Attribution/share-alike requirements apply. Rights clearance does not assert exact-location identity. |'
          row='| `public/images/tasks/cot-co-a-pa-chai.webp` | CLEARED | `public/images/tasks/provenance/cot-co-a-pa-chai.json`; exact derivative SHA-256 `8278dcb416174fd8549f432a76a7188b05e85a4944290034f3f27804fcd72395` regenerated from the Commons API-resolved canonical original SHA-256 `db7510b26103e9735b0d4e0eb841a9e6e1ae41f98fdd942568ab121ef80b38f1`. The source-discovery ledger identifies this as representative traditional-house / Dien Bien Phu imagery rather than an exact verified photograph of A Pa Chai Flag Tower or A Pa Chai Village. | Adam Jones from Kelowna, BC, Canada; CC BY-SA 2.0; link the licence and indicate that the image was resized/re-encoded. Attribution/share-alike requirements apply. Rights clearance does not assert exact-location identity. |'
          if text.count(anchor)!=1: raise SystemExit(f'explicit anchor count={text.count(anchor)}')
          if row in text: raise SystemExit('explicit row already present')
          text=text.replace(anchor,anchor+'\n'+row)
          ids=['cot-co-a-pa-chai-mthen','cot-co-a-pa-chai-trai-ban-lanh-lung','ban-a-pa-chai-tang-banh-trung-thu']
          for task_id in ids:
              old=f'| `{task_id}` | Present | UNVERIFIED | Reconcile the shipped binary to the exact original, then verify licence/version and attribution. |'
              new=f'| `{task_id}` | Present; shared exact binary regenerated from Commons API-resolved representative source and hashed in dedicated provenance record | CLEARED | Keep `public/images/tasks/provenance/cot-co-a-pa-chai.json` with the shared shipped binary; preserve Adam Jones / CC BY-SA 2.0 attribution, licence link, modification notice and share-alike terms. Public credit must disclose that the source is representative and does not verify the named A Pa Chai location. |'
              if text.count(old)!=1: raise SystemExit(f'{task_id} row count={text.count(old)}')
              text=text.replace(old,new)
          old='| `public/images/tasks/cot-co-a-pa-chai.webp` | 12 | UNVERIFIED | Add and reconcile the exact source/licence record for this path before editorial reuse. |'
          new='| `public/images/tasks/cot-co-a-pa-chai.webp` | 12 | CLEARED | Exact shipped derivative is covered by the dedicated provenance record and CC BY-SA 2.0 for three FIELD uses plus BOOK/editorial reuse; retain attribution, licence link, modification notice and share-alike terms. This is representative traditional-house / Dien Bien Phu imagery, not an exact verified photograph of A Pa Chai Flag Tower or Village. |'
          if text.count(old)!=1: raise SystemExit(f'book row count={text.count(old)}')
          text=text.replace(old,new)
          ledger.write_text(text)

          credits=Path('src/data/assetCredits.ts')
          text=credits.read_text()
          anchor="  {\n    id: 'bao-tang-chien-thang-dien-bien-phu-trai-nghiem',"
          entry="""  {
    id: 'cot-co-a-pa-chai',
    usage: { vi: 'Ảnh đại diện dùng cho ba thử thách A Pa Chải / artwork chương 12', en: 'Representative image used for three A Pa Chai challenges / Chapter 12 artwork' },
    author: 'Adam Jones from Kelowna, BC, Canada',
    sourceUrl: 'https://commons.wikimedia.org/wiki/File:Facade_of_Traditional_Wooden_House_-_Dien_Bien_Phu_-_Vietnam_(48178462826).jpg',
    ...cc('2.0'),
    status: 'cleared',
    note: {
      vi: 'Exact binary đang ship được tái tạo trong PR #85 từ canonical Commons original do MediaWiki API trả về, có hash nguồn/derivative và recipe trong release ledger. Đây là ảnh đại diện về nhà truyền thống / Điện Biên Phủ, không phải ảnh đã xác minh chính xác Cột cờ hoặc Bản A Pa Chải. CLEARED chỉ xác nhận quyền/provenance của binary. Ảnh đã được resize và re-encode sang WebP; CC BY-SA 2.0 và yêu cầu attribution/share-alike vẫn áp dụng.',
      en: 'The exact shipped binary was regenerated in PR #85 from the canonical Commons original returned by the MediaWiki API, with source/derivative hashes and the transform recipe recorded in the release ledger. This is representative traditional-house / Dien Bien Phu imagery, not an exact verified photograph of A Pa Chai Flag Tower or Village. CLEARED covers rights/provenance for the binary only. The image was resized and re-encoded to WebP; CC BY-SA 2.0 attribution/share-alike terms still apply.',
    },
  },
"""
          if "id: 'cot-co-a-pa-chai'" in text: raise SystemExit('Credits entry already present')
          if text.count(anchor)!=1: raise SystemExit(f'credits anchor count={text.count(anchor)}')
          text=text.replace(anchor,entry+anchor)
          credits.write_text(text)
          PY
      - name: Commit finalized clearance and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-cot-co-a-pa-chai.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/asset-provenance.md src/data/assetCredits.ts .github/workflows/finalize-cot-co-a-pa-chai.yml
          git commit -m 'Finalize A Pa Chai representative artwork clearance'
          git push origin HEAD:agent/clear-cot-co-a-pa-chai-artwork
