name: Fix PR64 typecheck

on:
  push:
    branches:
      - agent/production-hardening-final

permissions:
  contents: write

jobs:
  patch:
    # Temporary branch-only workflow; it deletes itself after applying the typing fixes.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-final
      - name: Apply typing-only fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          gameplay = Path('src/services/gameplay.ts')
          text = gameplay.read_text()
          old = '''  return runLockedMutation(\n    catalogTasks,\n    gate,\n    (authoritative) => ({ progress: authoritative, stale: true, assigned: false }),'''
          new = '''  return runLockedMutation<NextChallengeResult>(\n    catalogTasks,\n    gate,\n    (authoritative) => ({ progress: authoritative, stale: true, assigned: false }),'''
          if old not in text:
              raise SystemExit('assignRandomChallenge patch target not found')
          text = text.replace(old, new, 1)
          old = '''  return runLockedMutation(\n    catalogTasks,\n    gate,\n    (authoritative) => ({ progress: authoritative, stale: true, completed: false, duplicate: false }),'''
          new = '''  return runLockedMutation<CompleteChallengeResult>(\n    catalogTasks,\n    gate,\n    (authoritative) => ({ progress: authoritative, stale: true, completed: false, duplicate: false }),'''
          if old not in text:
              raise SystemExit('completeActiveChallenge patch target not found')
          gameplay.write_text(text)

          moderation = Path('src/services/moderation.ts')
          text = moderation.read_text()
          text = text.replace("supabase.rpc<boolean>('is_current_user_admin')", "supabase.rpc('is_current_user_admin')", 1)
          text = text.replace("supabase.rpc<ModerationRpcRow>('moderate_video_submission', {", "supabase.rpc('moderate_video_submission', {", 1)
          old = "  const row = Array.isArray(data) ? data[0] : null;"
          new = "  const rows = data as ModerationRpcRow[] | null;\n  const row = Array.isArray(rows) ? rows[0] : null;"
          if old not in text:
              raise SystemExit('moderation row patch target not found')
          text = text.replace(old, new, 1)
          moderation.write_text(text)

          voting = Path('src/services/voting.ts')
          text = voting.read_text()
          old = "supabase.rpc<VoteCountRow>('get_submission_vote_counts', {"
          if old not in text:
              raise SystemExit('voting rpc patch target not found')
          text = text.replace(old, "supabase.rpc('get_submission_vote_counts', {", 1)
          voting.write_text(text)

          tasks = Path('src/services/tasks.ts')
          text = tasks.read_text()
          old = '''  const candidate = value as Partial<ChallengeTask['gps']>;\n  const hasValidLat = typeof candidate.lat === 'number' && Number.isFinite(candidate.lat);\n  const hasValidLng = typeof candidate.lng === 'number' && Number.isFinite(candidate.lng);\n  const hasValidRadius = typeof candidate.radius === 'number' && Number.isFinite(candidate.radius) && candidate.radius > 0;\n\n  if (!hasValidLat || !hasValidLng || !hasValidRadius) {\n    return fallback;\n  }\n\n  return {\n    lat: candidate.lat,\n    lng: candidate.lng,\n    radius: candidate.radius,\n  };'''
          new = '''  const candidate = value as Partial<ChallengeTask['gps']>;\n  const lat = candidate.lat;\n  const lng = candidate.lng;\n  const radius = candidate.radius;\n\n  if (\n    typeof lat !== 'number' || !Number.isFinite(lat)\n    || typeof lng !== 'number' || !Number.isFinite(lng)\n    || typeof radius !== 'number' || !Number.isFinite(radius) || radius <= 0\n  ) {\n    return fallback;\n  }\n\n  return { lat, lng, radius };'''
          if old not in text:
              raise SystemExit('tasks normalizeGps patch target not found')
          text = text.replace(old, new, 1)
          tasks.write_text(text)
          PY
      - name: Remove one-shot workflow and push patch
        run: |
          rm .github/workflows/fix-pr64-typecheck.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/gameplay.ts src/services/moderation.ts src/services/tasks.ts src/services/voting.ts .github/workflows/fix-pr64-typecheck.yml
          git commit -m "Fix strict TypeScript verification"
          git push origin HEAD:agent/production-hardening-final
