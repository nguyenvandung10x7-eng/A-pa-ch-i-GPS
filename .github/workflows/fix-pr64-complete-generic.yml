name: Fix PR64 complete generic

on:
  push:
    branches:
      - agent/production-hardening-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-final
      - name: Patch completeActiveChallenge only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/gameplay.ts')
          text = path.read_text()
          marker = 'export const completeActiveChallenge = async ('
          start = text.index(marker)
          prefix = text[:start]
          suffix = text[start:]
          old = '  return runLockedMutation(\n    catalogTasks,\n    gate,\n    (authoritative) => ({ progress: authoritative, stale: true, completed: false, duplicate: false }),' 
          new = '  return runLockedMutation<CompleteChallengeResult>(\n    catalogTasks,\n    gate,\n    (authoritative) => ({ progress: authoritative, stale: true, completed: false, duplicate: false }),' 
          if old not in suffix:
              raise SystemExit('completeActiveChallenge target not found')
          suffix = suffix.replace(old, new, 1)
          path.write_text(prefix + suffix)
          PY
      - name: Remove workflow and push
        run: |
          rm .github/workflows/fix-pr64-complete-generic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/gameplay.ts .github/workflows/fix-pr64-complete-generic.yml
          git commit -m "Fix complete challenge result typing"
          git push origin HEAD:agent/production-hardening-final
