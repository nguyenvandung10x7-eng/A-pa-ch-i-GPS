name: Apply literary chapter copy

on:
  push:
    branches:
      - agent/literary-chapter-copy-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/literary-chapter-copy-v2
          fetch-depth: 0

      - name: Apply literary chapter intro layer
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/data/bookCatalog.ts')
          text = path.read_text()

          import_anchor = "import { BOOK_MUSIC_TRACKS } from './music';\n"
          import_line = "import { withLiteraryChapterCopy } from './bookLiteraryCopy';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('bookCatalog import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_export = "export const BOOK_CHAPTERS: BookChapter[] = [...BASE_BOOK_CHAPTERS.map(withUploadedChapterAssets), chapter13];"
          new_export = "export const BOOK_CHAPTERS: BookChapter[] = [\n  ...BASE_BOOK_CHAPTERS.map(withUploadedChapterAssets).map(withLiteraryChapterCopy),\n  withLiteraryChapterCopy(chapter13),\n];"
          if old_export not in text:
              raise SystemExit('BOOK_CHAPTERS export anchor not found')
          text = text.replace(old_export, new_export, 1)
          path.write_text(text)

      - name: Commit literary catalog wiring and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-literary-copy.yml
          git add src/data/bookCatalog.ts
          git diff --cached --check
          git commit -m "Apply literary chapter intros to canonical catalog"
          git push origin HEAD:agent/literary-chapter-copy-v2
