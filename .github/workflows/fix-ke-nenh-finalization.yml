name: Repair Ke Nenh clearance finalization

on:
  push:
    branches:
      - agent/fix-ke-nenh-clearance-finalization

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/agent/fix-ke-nenh-clearance-finalization'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/fix-ke-nenh-clearance-finalization
          fetch-depth: 0
      - name: Apply guarded metadata repair
        run: python3 .github/repair-ke-nenh.py
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/finalize-thac-ke-nenh-clearance.yml
          rm .github/workflows/finalize-thac-ke-nenh-clearance.yml
          rm .github/workflows/fix-ke-nenh-finalization.yml
          rm .github/repair-ke-nenh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/asset-provenance.md src/data/assetCredits.ts .github/workflows/finalize-thac-ke-nenh-clearance.yml .github/workflows/fix-ke-nenh-finalization.yml .github/repair-ke-nenh.py
          git commit -m 'Finalize Ke Nenh clearance metadata'
          git push origin HEAD:agent/fix-ke-nenh-clearance-finalization
