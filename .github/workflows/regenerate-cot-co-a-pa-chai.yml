name: Regenerate cleared A Pa Chai representative artwork

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'agent/clear-cot-co-a-pa-chai-artwork'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/clear-cot-co-a-pa-chai-artwork
          fetch-depth: 0
      - name: Install media tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Resolve Commons metadata and rebuild derivative
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, urllib.parse, urllib.request
          title='File:Facade of Traditional Wooden House - Dien Bien Phu - Vietnam (48178462826).jpg'
          q=urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|size|extmetadata','titles':title})
          data=json.load(urllib.request.urlopen('https://commons.wikimedia.org/w/api.php?'+q))
          info=next(iter(data['query']['pages'].values()))['imageinfo'][0]
          meta=info['extmetadata']
          assert info['width']==3648 and info['height']==2736
          assert 'Adam Jones' in meta['Artist']['value']
          assert meta['LicenseShortName']['value']=='CC BY-SA 2.0'
          json.dump({'original_url':info['url'],'revision':info.get('timestamp')},open('/tmp/meta.json','w'))
          urllib.request.urlretrieve(info['url'],'/tmp/source.jpg')
          PY
          sha256sum /tmp/source.jpg > /tmp/source.sha
          ffmpeg -y -i /tmp/source.jpg -vf scale=1920:-2:flags=lanczos -c:v libwebp -lossless 0 -compression_level 6 -q:v 84 -an public/images/tasks/cot-co-a-pa-chai.webp
          sha256sum public/images/tasks/cot-co-a-pa-chai.webp > /tmp/derivative.sha
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 public/images/tasks/cot-co-a-pa-chai.webp > /tmp/dims.txt
          python3 <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.load(open('/tmp/meta.json'))
          record={'asset':'public/images/tasks/cot-co-a-pa-chai.webp','status_basis':'regenerated-from-commons-api-resolved-source','checked_on':'2026-08-22','reviewed_by':'nguyenvandung10x7-eng','review_method':'Reproducible GitHub Actions rebuild using Commons MediaWiki API metadata plus exact source/derivative SHA-256 hashes.','source':{'commons_page':'https://commons.wikimedia.org/wiki/File:Facade_of_Traditional_Wooden_House_-_Dien_Bien_Phu_-_Vietnam_(48178462826).jpg','original_url':m['original_url'],'author':'Adam Jones from Kelowna, BC, Canada','license':'CC BY-SA 2.0','license_url':'https://creativecommons.org/licenses/by-sa/2.0','dimensions':'3648x2736','sha256':open('/tmp/source.sha').read().split()[0],'commons_revision_timestamp':m.get('revision')},'derivative':{'dimensions':open('/tmp/dims.txt').read().strip(),'sha256':open('/tmp/derivative.sha').read().split()[0],'changes':'Resized proportionally to 1920 px width with Lanczos filtering and re-encoded as lossy WebP; no crop, overlay, watermark removal, or content edit.','command':'ffmpeg -i SOURCE -vf scale=1920:-2:flags=lanczos -c:v libwebp -lossless 0 -compression_level 6 -q:v 84 -an OUTPUT','tool':subprocess.check_output(['ffmpeg','-version'],text=True).splitlines()[0],'runner':'ubuntu-24.04','license':'CC BY-SA 2.0'},'attribution':'Facade of Traditional Wooden House - Dien Bien Phu - Vietnam — Adam Jones from Kelowna, BC, Canada — CC BY-SA 2.0 — resized and re-encoded to WebP by Book of Dien Bien.','restrictions':'Derivative, editorial, commercial and redistribution use must comply with CC BY-SA 2.0, including attribution and share-alike requirements where applicable.','representation_note':'This Commons image is representative Dien Bien Phu / traditional-house imagery, not an exact verified photograph of A Pa Chai Flag Tower or A Pa Chai Village. CLEARED refers to rights/provenance for the exact shipped binary only and does not assert exact-location identity.','reuse_note':'The same exact binary is used by three enabled FIELD tasks and Book Chapter 12.'}
          p=Path('public/images/tasks/provenance/cot-co-a-pa-chai.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit regenerated asset and provenance record
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-cot-co-a-pa-chai.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/tasks/cot-co-a-pa-chai.webp public/images/tasks/provenance/cot-co-a-pa-chai.json .github/workflows/regenerate-cot-co-a-pa-chai.yml
          git commit -m 'Regenerate A Pa Chai representative artwork with provenance'
          git push origin HEAD:agent/clear-cot-co-a-pa-chai-artwork
