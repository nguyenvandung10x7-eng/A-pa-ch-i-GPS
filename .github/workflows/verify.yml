name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - remake/phieng-loi-v2
      - task/pl-00-runtime-foundation
      - task/pl-hs-01-reveal

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run verify
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: PL-00 and Task 01 browser lifecycle tests
        run: npm run test:pl00
      - name: Upload PL-00 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl00-browser-evidence
          path: |
            node_modules/.cache/pl00-report
            node_modules/.cache/pl00-results
          include-hidden-files: true
          retention-days: 7
