name: Regenerate cleared Vu A Dinh representative artwork

on:
  push:
    branches:
      - agent/clear-vu-a-dinh-representative-artwork

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/clear-vu-a-dinh-representative-artwork
          fetch-depth: 0
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Resolve Commons metadata and rebuild derivative
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, urllib.parse, urllib.request, subprocess, hashlib, pathlib

          title='File:Landscape on Edge of Dien Bien Phu - Vietnam (48168741986).jpg'
          params={
            'action':'query','format':'json','prop':'imageinfo','titles':title,
            'iiprop':'url|size|extmetadata'
          }
          url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url, headers={'User-Agent':'BookOfDienBienProvenance/1.0 (GitHub Actions; contact via repository)'})
          with urllib.request.urlopen(req, timeout=30) as r:
            data=json.load(r)
          page=next(iter(data['query']['pages'].values()))
          ii=page['imageinfo'][0]
          meta=ii['extmetadata']
          assert ii['width']==3648 and ii['height']==2736, (ii['width'], ii['height'])
          artist=meta.get('Artist',{}).get('value','')
          license_short=meta.get('LicenseShortName',{}).get('value','')
          if 'Adam Jones' not in artist:
            raise SystemExit(f'Unexpected artist: {artist}')
          if license_short != 'CC BY-SA 2.0':
            raise SystemExit(f'Unexpected licence: {license_short}')
          original=ii['url']
          src=pathlib.Path('/tmp/vu-a-dinh-source.jpg')
          req=urllib.request.Request(original, headers={'User-Agent':'BookOfDienBienProvenance/1.0 (GitHub Actions; contact via repository)'})
          with urllib.request.urlopen(req, timeout=60) as r, src.open('wb') as f:
            f.write(r.read())
          source_hash=hashlib.sha256(src.read_bytes()).hexdigest()
          out=pathlib.Path('public/images/tasks/cong-vien-vu-a-dinh-trai-ban.webp')
          subprocess.run(['ffmpeg','-y','-i',str(src),'-vf','scale=1920:-2:flags=lanczos','-c:v','libwebp','-lossless','0','-compression_level','6','-q:v','84','-an',str(out)], check=True)
          derivative_hash=hashlib.sha256(out.read_bytes()).hexdigest()
          probe=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=s=x:p=0',str(out)], text=True).strip()
          if probe != '1920x1440':
            raise SystemExit(f'Unexpected derivative dimensions: {probe}')
          ffmpeg_version=subprocess.check_output(['ffmpeg','-version'], text=True).splitlines()[0]
          record={
            'asset':'public/images/tasks/cong-vien-vu-a-dinh-trai-ban.webp',
            'status_basis':'regenerated-from-commons-api-resolved-source',
            'checked_on':'2026-08-22',
            'reviewed_by':'nguyenvandung10x7-eng',
            'review_method':'Reproducible GitHub Actions rebuild using Commons MediaWiki API metadata plus exact source/derivative SHA-256 hashes.',
            'source':{
              'commons_page':'https://commons.wikimedia.org/wiki/File:Landscape_on_Edge_of_Dien_Bien_Phu_-_Vietnam_(48168741986).jpg',
              'original_url':original,
              'author':'Adam Jones from Kelowna, BC, Canada',
              'license':'CC BY-SA 2.0',
              'license_url':'https://creativecommons.org/licenses/by-sa/2.0',
              'dimensions':'3648x2736',
              'sha256':source_hash,
            },
            'derivative':{
              'dimensions':probe,
              'sha256':derivative_hash,
              'changes':'Resized proportionally to 1920 px width with Lanczos filtering and re-encoded as lossy WebP; no crop, overlay, watermark removal, or content edit.',
              'command':'ffmpeg -i SOURCE -vf scale=1920:-2:flags=lanczos -c:v libwebp -lossless 0 -compression_level 6 -q:v 84 -an OUTPUT',
              'tool':ffmpeg_version,
              'runner':'ubuntu-24.04',
              'license':'CC BY-SA 2.0'
            },
            'attribution':'Landscape on Edge of Dien Bien Phu - Vietnam — Adam Jones from Kelowna, BC, Canada — CC BY-SA 2.0 — resized and re-encoded to WebP by Book of Dien Bien.',
            'restrictions':'Derivative, editorial, commercial and redistribution use must comply with CC BY-SA 2.0, including attribution and share-alike requirements where applicable.',
            'representation_note':'This Commons image is representative Dien Bien Phu landscape imagery, not an exact verified photograph of Công viên Vừ A Dính. CLEARED refers to rights/provenance for the exact shipped binary only and does not assert exact-location identity.'
          }
          p=pathlib.Path('public/images/tasks/provenance/cong-vien-vu-a-dinh-trai-ban.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(record, ensure_ascii=False, indent=2)+'\n')
          print('source_sha256',source_hash)
          print('derivative_sha256',derivative_hash)
          PY
      - name: Commit regenerated asset and provenance then self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-vu-a-dinh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/tasks/cong-vien-vu-a-dinh-trai-ban.webp public/images/tasks/provenance/cong-vien-vu-a-dinh-trai-ban.json .github/workflows/regenerate-vu-a-dinh.yml
          git commit -m 'Regenerate Vu A Dinh representative artwork with provenance'
          git push origin HEAD:agent/clear-vu-a-dinh-representative-artwork
