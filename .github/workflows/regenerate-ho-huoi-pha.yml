name: Regenerate Huoi Pha representative artwork

on:
  push:
    branches:
      - agent/clear-ho-huoi-pha-representative-artwork
    paths:
      - .github/workflows/regenerate-ho-huoi-pha.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clear-ho-huoi-pha-representative-artwork
          fetch-depth: 0
      - name: Install media tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Resolve Commons metadata and rebuild derivative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          title = 'File:Ron River View - Dien Bien Phu - Vietnam (48159135931).jpg'
          params = urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','titles':title,'iiprop':'url|size|extmetadata'})
          req = urllib.request.Request('https://commons.wikimedia.org/w/api.php?' + params, headers={'User-Agent':'BookOfDienBienAssetAudit/1.0'})
          data = json.load(urllib.request.urlopen(req))
          page = next(iter(data['query']['pages'].values()))
          ii = page['imageinfo'][0]
          meta = ii['extmetadata']
          author = meta.get('Artist',{}).get('value','')
          licence = meta.get('LicenseShortName',{}).get('value','')
          assert 'Adam Jones' in author, author
          assert licence == 'CC BY-SA 2.0', licence
          out = {'original_url':ii['url'],'author':author,'license':licence,'width':ii['width'],'height':ii['height']}
          open('/tmp/meta.json','w').write(json.dumps(out, ensure_ascii=False))
          req2 = urllib.request.Request(ii['url'], headers={'User-Agent':'BookOfDienBienAssetAudit/1.0'})
          open('/tmp/source.jpg','wb').write(urllib.request.urlopen(req2).read())
          PY
          expected=$(python3 -c "import json; m=json.load(open('/tmp/meta.json')); print(f\"{m['width']}x{m['height']}\")")
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/source.jpg)" = "$expected"
          ffmpeg -y -i /tmp/source.jpg -vf scale=1920:-2:flags=lanczos -c:v libwebp -lossless 0 -compression_level 6 -q:v 84 -an public/images/tasks/ho-huoi-pha-mthen.webp
          source_sha=$(sha256sum /tmp/source.jpg | awk '{print $1}')
          derivative_sha=$(sha256sum public/images/tasks/ho-huoi-pha-mthen.webp | awk '{print $1}')
          tool=$(ffmpeg -version | head -n1)
          SOURCE_SHA="$source_sha" DERIVATIVE_SHA="$derivative_sha" TOOL="$tool" python3 - <<'PY'
          import json, os
          meta=json.load(open('/tmp/meta.json'))
          h=round(meta['height']*1920/meta['width']); h += h % 2
          record={
            'asset':'public/images/tasks/ho-huoi-pha-mthen.webp',
            'status_basis':'regenerated-from-commons-api-resolved-source',
            'checked_on':'2026-08-22',
            'reviewed_by':'nguyenvandung10x7-eng',
            'review_method':'Reproducible GitHub Actions rebuild using Commons MediaWiki API metadata plus exact source/derivative SHA-256 hashes.',
            'source':{'commons_page':'https://commons.wikimedia.org/wiki/File:Ron_River_View_-_Dien_Bien_Phu_-_Vietnam_(48159135931).jpg','original_url':meta['original_url'],'author':'Adam Jones from Kelowna, BC, Canada','license':'CC BY-SA 2.0','license_url':'https://creativecommons.org/licenses/by-sa/2.0','dimensions':f"{meta['width']}x{meta['height']}",'sha256':os.environ['SOURCE_SHA']},
            'derivative':{'dimensions':f'1920x{h}','sha256':os.environ['DERIVATIVE_SHA'],'changes':'Resized proportionally to 1920 px width with Lanczos filtering and re-encoded as lossy WebP; no crop, overlay, watermark removal, or content edit.','command':'ffmpeg -i SOURCE -vf scale=1920:-2:flags=lanczos -c:v libwebp -lossless 0 -compression_level 6 -q:v 84 -an OUTPUT','tool':os.environ['TOOL'],'runner':'ubuntu-24.04','license':'CC BY-SA 2.0'},
            'attribution':'Ron River View - Dien Bien Phu - Vietnam — Adam Jones from Kelowna, BC, Canada — CC BY-SA 2.0 — resized and re-encoded to WebP by Book of Dien Bien.',
            'restrictions':'Derivative, editorial, commercial and redistribution use must comply with CC BY-SA 2.0, including attribution and share-alike requirements where applicable.',
            'representation_note':'This Commons image is representative Dien Bien Phu river scenery, not an exact verified photograph of Hồ Huổi Phạ. CLEARED refers to rights/provenance for the exact shipped binary only and does not assert exact-location identity.'}
          os.makedirs('public/images/tasks/provenance', exist_ok=True)
          open('public/images/tasks/provenance/ho-huoi-pha-mthen.json','w').write(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit regenerated asset and provenance, then self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-ho-huoi-pha.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/images/tasks/ho-huoi-pha-mthen.webp public/images/tasks/provenance/ho-huoi-pha-mthen.json .github/workflows/regenerate-ho-huoi-pha.yml
          git commit -m 'Regenerate Huoi Pha representative artwork with provenance'
          git push origin HEAD:agent/clear-ho-huoi-pha-representative-artwork
